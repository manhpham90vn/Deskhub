name: publish-packages

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v6.0.0'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-packages-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  winget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open the winget-pkgs pull requests
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: scripts/publish-winget.sh "$TAG"

  homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: scripts/publish-homebrew.sh "$TAG"

  build-apt-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and sign the apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: scripts/build-apt-repo.sh out/pages/apt

      - name: Add the site root, which points at the GitHub repository
        run: cp packaging/pages/index.html out/pages/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/pages

  deploy-apt-repo:
    needs: build-apt-repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}apt/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
