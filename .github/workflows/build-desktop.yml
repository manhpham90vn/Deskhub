name: build-desktop

on:
  workflow_call:
    inputs:
      for_release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_EXE: out/build/x64-release/client/windows/win32/Deskhub.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja + NASM
        run: choco install ninja nasm -y

      - uses: ./.github/actions/third-party
        with:
          targets: windows
          cache-key: windows

      - name: Configure
        run: cmake --preset x64-release

      - name: Build the Windows app
        shell: bash
        run: |
          cmake --build --preset x64-release 2>&1 | tee app-build.log ||
            { grep -iE "error|warning C[0-9]|LNK[0-9]" app-build.log | tail -40 | sed 's/^/::error::/' || true
              exit 1; }

      - name: Assert the exe needs no redistributable
        shell: pwsh
        run: |
          $deps = dumpbin /dependents $env:APP_EXE
          $deps
          $bad = $deps | Select-String -Pattern 'VCRUNTIME|MSVCP\d|MSVCR\d'
          if ($bad) {
            Write-Output "::error::$env:APP_EXE needs the Visual C++ Redistributable - the release is supposed to be a single self-contained exe"
            exit 1
          }
          Write-Output "OK - the MSVC runtime is linked statically."

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y
          $version = (Get-Content VERSION -Raw).Trim()
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" packaging/windows/Deskhub.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows installer shortcuts and uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'out/installer/DeskHub-Setup.exe').Path
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\DeskHub\Deskhub.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'DeskHub.lnk'
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'DeskHub.lnk'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/NORESTART' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          if (-not (Test-Path $installed) -or -not (Test-Path $shortcut) -or -not (Test-Path $desktopShortcut)) {
            throw 'Installer did not install the app and both shortcuts'
          }
          $uninstall = Start-Process (Join-Path (Split-Path $installed) 'unins000.exe') -ArgumentList '/VERYSILENT', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          if ((Test-Path $shortcut) -or (Test-Path $desktopShortcut)) {
            throw 'Uninstaller left a shortcut behind'
          }

      - name: Upload installer
        if: ${{ inputs.for_release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-windows-installer
          path: out/installer/DeskHub-Setup.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-windows
          path: ${{ env.APP_EXE }}
          retention-days: 14
          if-no-files-found: error

  macos:
    if: ${{ !inputs.for_release }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/third-party
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
          cache-key: macos

      - name: Build macOS app (make release-macos, ad-hoc signing)
        run: make release-macos MACOS_SIGN=adhoc

      - name: Verify the ad-hoc signature is well formed
        run: codesign --verify --strict --verbose=2 out/build/macos/Release/app.app

      - name: Zip app bundle
        run: ditto -c -k --keepParent out/build/macos/Release/app.app deskhub-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-macos
          path: deskhub-macos.zip
          retention-days: 14
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.for_release
          && fromJSON('[{"os":"ubuntu-22.04","release":true}]')
          || fromJSON('[{"os":"ubuntu-22.04","release":true},{"os":"ubuntu-latest","release":false}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: >
          scripts/apt-install.sh ninja-build pkg-config nasm
          libgtk-3-dev libglib2.0-dev libepoxy-dev libegl-dev libgles-dev
          libdrm-dev libva-dev libpipewire-0.3-dev libspa-0.2-dev
          libayatana-appindicator3-dev libx11-dev libxfixes-dev

      - name: Cache minimal FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg-min
          key: ffmpeg-min-${{ matrix.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build minimal FFmpeg (static, h264 decode only)
        run: scripts/build-ffmpeg.sh

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-${{ matrix.os }}

      - name: Check CMake version
        run: |
          have=$(cmake --version | head -1 | awk '{print $3}')
          need=3.25
          echo "CMake $have (need >= $need)"
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] \
            || { echo "::error::CMake $have is too old — the root CMakeLists needs $need"; exit 1; }

      - name: Turn a missing dependency into a build failure
        run: cmake --preset x64-release -DDESKHUB_REQUIRE_LINUX_APP=ON -DDESKHUB_CLI=ON

      - name: Build the Ubuntu app (make release-linux)
        run: make release-linux

      - name: Build the command-line client for its own packages
        run: make release-cli

      - name: Assert no dynamic FFmpeg dependency
        run: |
          bin=out/build/x64-release/client/linux/deskhub
          if readelf -d "$bin" | grep -q 'NEEDED.*libav'; then
            echo "::error::$bin links libav* dynamically — the release would not start on newer Ubuntu"
            readelf -d "$bin" | grep NEEDED
            exit 1
          fi
          echo "OK — FFmpeg is linked statically. Dynamic dependencies:"
          readelf -d "$bin" | grep NEEDED

      - name: Upload app
        if: matrix.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-linux
          path: out/build/x64-release/client/linux/deskhub
          retention-days: 14
          if-no-files-found: error

      - name: Package the deb (scripts/build-deb.sh)
        if: matrix.release
        run: scripts/build-deb.sh

      - name: Install the deb and verify its payload
        if: matrix.release
        run: |
          sudo apt-get install -y ./out/dist/linux/deskhub_*.deb
          test -x /usr/bin/deskhub
          test ! -e /usr/bin/deskhub-cli
          test -f /usr/share/applications/deskhub.desktop
          grep -q '^Exec=deskhub$' /usr/share/applications/deskhub.desktop
          test -f /usr/lib/udev/rules.d/60-deskhub-uinput.rules
          test -f /usr/lib/modules-load.d/deskhub.conf
          dpkg-deb --info out/dist/linux/deskhub_*.deb

      - name: Package and install the CLI deb separately
        if: matrix.release
        run: |
          scripts/build-cli-deb.sh
          sudo apt-get install -y ./out/dist/linux/deskhub-cli_*.deb
          test -x /usr/bin/deskhub-cli
          test -f /usr/lib/udev/rules.d/60-deskhub-cli-uinput.rules
          test -f /usr/lib/modules-load.d/deskhub-cli.conf
          test "$(dpkg-query -S /usr/bin/deskhub-cli | cut -d: -f1)" = deskhub-cli
          dpkg-deb --info out/dist/linux/deskhub-cli_*.deb

      - name: Upload deb
        if: matrix.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-linux-deb
          path: out/dist/linux/deskhub_*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Upload CLI deb
        if: matrix.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-cli-linux-deb
          path: out/dist/linux/deskhub-cli_*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Package the rpm (scripts/build-rpm.sh)
        if: matrix.release
        run: |
          scripts/apt-install.sh rpm
          scripts/build-rpm.sh
          scripts/build-cli-rpm.sh

      - name: Install the rpm in a Fedora container and verify its payload
        if: matrix.release
        run: |
          docker run --rm -v "$PWD/out/dist/linux:/pkg:ro" fedora:latest bash -ec '
            dnf install -y -q /pkg/deskhub-cli-*.rpm
            test -x /usr/bin/deskhub-cli
            test ! -e /usr/bin/deskhub
            dnf install -y -q /pkg/deskhub-[0-9]*.rpm
            test -x /usr/bin/deskhub
            test -x /usr/bin/deskhub-cli
            test -f /usr/share/applications/deskhub.desktop
            test -f /usr/lib/udev/rules.d/60-deskhub-uinput.rules
            test -f /usr/lib/udev/rules.d/60-deskhub-cli-uinput.rules
            test -f /usr/lib/modules-load.d/deskhub.conf
            if ldd /usr/bin/deskhub | grep "not found"; then
              echo "::error::unresolved shared libraries after dnf install"
              exit 1
            fi
            rpm -q deskhub deskhub-cli'

      - name: Upload rpm
        if: matrix.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-linux-rpm
          path: out/dist/linux/deskhub-[0-9]*.rpm
          retention-days: 14
          if-no-files-found: error

      - name: Upload CLI rpm
        if: matrix.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-cli-linux-rpm
          path: out/dist/linux/deskhub-cli-*.rpm
          retention-days: 14
          if-no-files-found: error
