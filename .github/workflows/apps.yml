name: apps

# Reusable client builds. build.yml runs the whole set on every push/PR;
# deploy.yml calls it with for_release=true, where only the two binaries that
# get attached to a GitHub release are built here — the macOS/iOS/Android
# artifacts come from the signed fastlane jobs instead.
on:
  workflow_call:
    inputs:
      for_release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_EXE: out/build/x64-release/client/windows/win32/Deskhub.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset x64-release

      - name: Build the Windows app
        run: cmake --build --preset x64-release

      - name: Assert no Visual C++ Redistributable dependency
        shell: pwsh
        run: |
          $deps = dumpbin /dependents $env:APP_EXE
          $deps
          $bad = $deps | Select-String -Pattern 'VCRUNTIME|MSVCP\d|MSVCR\d'
          if ($bad) {
            Write-Output "::error::$env:APP_EXE needs the Visual C++ Redistributable - the release is supposed to be a single self-contained exe"
            exit 1
          }
          Write-Output "OK - the MSVC runtime is linked statically."

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-windows
          path: ${{ env.APP_EXE }}
          retention-days: 14
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      # On a release run only the ubuntu-22.04 row matters (its binary is the one
      # attached to the GitHub release); the newer-Ubuntu compile check adds nothing.
      matrix:
        include: ${{ inputs.for_release
          && fromJSON('[{"os":"ubuntu-22.04","release":true}]')
          || fromJSON('[{"os":"ubuntu-22.04","release":true},{"os":"ubuntu-latest","release":false}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build pkg-config nasm \
            libgtk-3-dev libglib2.0-dev libepoxy-dev libegl-dev libgles-dev \
            libdrm-dev libva-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: Cache minimal FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg-min
          key: ffmpeg-min-${{ matrix.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build minimal FFmpeg (static, h264 decode only)
        run: scripts/build-ffmpeg.sh

      - name: Check CMake version
        run: |
          have=$(cmake --version | head -1 | awk '{print $3}')
          need=3.25
          echo "CMake $have (need >= $need)"
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] \
            || { echo "::error::CMake $have is too old — the root CMakeLists needs $need"; exit 1; }

      - name: Turn a missing dependency into a build failure
        run: cmake --preset x64-release -DDESKHUB_REQUIRE_LINUX_APP=ON

      - name: Build the Ubuntu app (make release-linux)
        run: make release-linux

      - name: Assert no dynamic FFmpeg dependency
        run: |
          bin=out/build/x64-release/client/linux/deskhub
          if readelf -d "$bin" | grep -q 'NEEDED.*libav'; then
            echo "::error::$bin links libav* dynamically — the release would not start on newer Ubuntu"
            readelf -d "$bin" | grep NEEDED
            exit 1
          fi
          echo "OK — FFmpeg is linked statically. Dynamic dependencies:"
          readelf -d "$bin" | grep NEEDED

      - name: Upload app
        if: matrix.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-linux
          path: out/build/x64-release/client/linux/deskhub
          retention-days: 14
          if-no-files-found: error

      - name: Package the deb (scripts/build-deb.sh)
        if: matrix.release
        run: scripts/build-deb.sh

      - name: Install the deb and verify its payload
        if: matrix.release
        run: |
          sudo apt-get install -y ./out/dist/linux/deskhub_*.deb
          test -x /usr/bin/deskhub
          test -f /usr/lib/udev/rules.d/60-deskhub-uinput.rules
          test -f /usr/lib/modules-load.d/deskhub.conf
          dpkg-deb --info out/dist/linux/deskhub_*.deb

      - name: Upload deb
        if: matrix.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-linux-deb
          path: out/dist/linux/deskhub_*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Package the rpm (scripts/build-rpm.sh)
        if: matrix.release
        run: |
          sudo apt-get install -y rpm
          scripts/build-rpm.sh

      - name: Install the rpm in a Fedora container and verify its payload
        if: matrix.release
        run: |
          docker run --rm -v "$PWD/out/dist/linux:/pkg:ro" fedora:latest bash -ec '
            dnf install -y -q /pkg/deskhub-*.rpm
            test -x /usr/bin/deskhub
            test -f /usr/lib/udev/rules.d/60-deskhub-uinput.rules
            test -f /usr/lib/modules-load.d/deskhub.conf
            if ldd /usr/bin/deskhub | grep "not found"; then
              echo "::error::unresolved shared libraries after dnf install"
              exit 1
            fi
            rpm -q deskhub'

      - name: Upload rpm
        if: matrix.release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-linux-rpm
          path: out/dist/linux/deskhub-*.rpm
          retention-days: 14
          if-no-files-found: error

  macos:
    if: ${{ !inputs.for_release }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build macOS app (make release-macos, ad-hoc signing)
        run: make release-macos MACOS_SIGN=adhoc

      - name: Verify the ad-hoc signature is well formed
        run: codesign --verify --strict --verbose=2 out/build/macos/Release/app.app

      - name: Zip app bundle
        run: ditto -c -k --keepParent out/build/macos/Release/app.app deskhub-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-macos
          path: deskhub-macos.zip
          retention-days: 14
          if-no-files-found: error

  android:
    if: ${{ !inputs.for_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build debug APK (make build-android)
        run: make build-android

      - name: Upload apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-android
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    if: ${{ !inputs.for_release }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build iOS app for Simulator (make build-ios)
        run: make build-ios
