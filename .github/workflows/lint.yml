name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned style tools
        run: |
          source scripts/pinned-versions.txt
          pipx install clang-format==$CLANG_FORMAT_VERSION
          mkdir -p tools
          curl -fsSL --retry 5 --retry-all-errors -o tools/ktlint.jar https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint
          echo "$KTLINT_SHA256  tools/ktlint.jar" | sha256sum -c -
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat_linux.zip
          echo "$SWIFTFORMAT_LINUX_SHA256  /tmp/swiftformat.zip" | sha256sum -c -
          unzip -o -q -d tools /tmp/swiftformat.zip swiftformat_linux
          mv tools/swiftformat_linux tools/swiftformat
          chmod +x tools/swiftformat

      - name: Check formatting (cpp + kotlin + swift)
        run: scripts/codestyle.sh --check

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned clang-tidy + ninja
        run: |
          source scripts/pinned-versions.txt
          pipx install clang-tidy==$CLANG_TIDY_VERSION
          scripts/apt-install.sh ninja-build

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-ubuntu-latest

      - name: Generate the compile database
        run: cmake --preset x64-debug -DDESKHUB_LINUX_APP=OFF

      - name: Static analysis over core/src + platform/src
        run: scripts/clang-tidy.sh

  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ninja (cppcheck is built from its pinned source)
        run: scripts/apt-install.sh ninja-build

      - name: Restore the pinned cppcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/cppcheck
          key: cppcheck-${{ runner.os }}-${{ hashFiles('scripts/pinned-versions.txt') }}

      - name: Unused C++ functions, FFI functions, string ids and Kotlin code
        run: scripts/dead-code.sh

  periphery:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/third-party
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios-sim aarch64-apple-ios
          cache-key: periphery

      - name: Unused Swift code in both Apple apps (Periphery)
        run: scripts/periphery.sh

  swiftlint:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint 0.65.0 (pinned)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/portable_swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.0/portable_swiftlint.zip
          echo "d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6  /tmp/portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -o -q -d /tmp/swiftlint /tmp/portable_swiftlint.zip swiftlint
          chmod +x /tmp/swiftlint/swiftlint
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"

      - name: SwiftLint check
        run: >
          swiftlint lint --strict client/apple/swift client/ios/app/swift
          client/ios/broadcast/swift client/ios/shared client/macos/app/swift

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-sdk
        with:
          gradle: 'true'

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: client/android/app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }} (pinned)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          chmod +x /tmp/actionlint

      - name: Lint the workflows
        run: /tmp/actionlint -color

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: scripts/apt-install.sh shellcheck

      - name: Lint the shell scripts
        run: shellcheck --severity=warning scripts/*.sh
