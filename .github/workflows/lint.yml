name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned tools (clang-format 22.1.3, ktlint 1.5.0, swiftformat 0.62.1)
        run: |
          pipx install clang-format==22.1.3
          mkdir -p tools
          curl -fsSL -o tools/ktlint.jar https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          echo "a16be01dcc480aab2f55f444b620142152f66e31564b3b9376506d624c28a2ad  tools/ktlint.jar" | sha256sum -c -
          curl -fsSL -o /tmp/swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat_linux.zip
          echo "61ff55f3581e2144a4ad114831167102c38be853df75c1477d20b40a8e8120aa  /tmp/swiftformat.zip" | sha256sum -c -
          unzip -o -q -d tools /tmp/swiftformat.zip swiftformat_linux
          mv tools/swiftformat_linux tools/swiftformat
          chmod +x tools/swiftformat

      - name: Check formatting (cpp + kotlin + swift)
        run: scripts/codestyle.sh --check

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-tidy 22.1.8 (pinned) + ninja
        run: |
          pipx install clang-tidy==22.1.8
          scripts/apt-install.sh ninja-build

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-ubuntu-latest

      - name: Generate the compile database
        run: cmake --preset x64-debug -DDESKHUB_LINUX_APP=OFF

      - name: Static analysis over core/src + platform/src
        run: scripts/clang-tidy.sh

  swiftlint:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint 0.65.0 (pinned)
        run: |
          curl -fsSL -o /tmp/portable_swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.0/portable_swiftlint.zip
          echo "d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6  /tmp/portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -o -q -d /tmp/swiftlint /tmp/portable_swiftlint.zip swiftlint
          chmod +x /tmp/swiftlint/swiftlint
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"

      - name: SwiftLint check
        run: >
          swiftlint lint --strict client/apple/swift client/ios/app/swift
          client/ios/broadcast/swift client/ios/shared client/macos/app/swift

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-sdk
        with:
          gradle: 'true'

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: client/android/app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }} (pinned)
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          chmod +x /tmp/actionlint

      - name: Lint the workflows
        run: /tmp/actionlint -color

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: scripts/apt-install.sh shellcheck

      - name: Lint the shell scripts
        run: shellcheck --severity=warning scripts/*.sh
