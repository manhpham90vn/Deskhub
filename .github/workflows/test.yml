name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} · ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    preset: x64-debug }
          - { os: ubuntu-latest,    preset: x64-release }
          - { os: ubuntu-24.04-arm, preset: arm64-debug }
          - { os: ubuntu-24.04-arm, preset: arm64-release }
          - { os: macos-latest,     preset: arm64-debug }
          - { os: macos-latest,     preset: arm64-release }
          - { os: windows-latest,   preset: x64-debug }
          - { os: windows-latest,   preset: x64-release }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   scripts/apt-install.sh ninja-build ;;
            macOS)   brew install ninja ;;
            Windows) choco install ninja nasm -y ;;
          esac

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-${{ matrix.os }}

      - name: Configure (app off — this job only tests core/platform/integration)
        run: cmake --preset ${{ matrix.preset }} -DDESKHUB_LINUX_APP=OFF

      - name: Build the three test binaries and the perf harness
        shell: bash
        run: |
          cmake --build --preset ${{ matrix.preset }} \
              --target core_tests platform_tests integration_tests core_perf platform_perf 2>&1 | tee build.log ||
            { grep -iE "error|warning C[0-9]|LNK[0-9]" build.log | tail -40 | sed 's/^/::error::/' || true
              exit 1; }

      - name: Ask Windows to keep a dump when a test dies by fail-fast, which runs no in-process handler and so prints no stack
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name DumpFolder -Value "$env:RUNNER_TEMP\crash-dumps" -Type ExpandString
          Set-ItemProperty -Path $key -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $key -Name DumpCount -Value 2 -Type DWord

      - name: Run them through CTest
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

      - name: Look for a crash dump
        id: crash-dump
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = Test-Path "$env:RUNNER_TEMP\crash-dumps\*.dmp"
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload the crash dump beside the symbols without which nothing can read it
        if: failure() && runner.os == 'Windows' && steps.crash-dump.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-${{ matrix.os }}-${{ matrix.preset }}
          path: |
            ${{ runner.temp }}/crash-dumps
            out/build/${{ matrix.preset }}/tests/integration/integration_tests.exe
            out/build/${{ matrix.preset }}/tests/integration/integration_tests.pdb
          if-no-files-found: ignore
          retention-days: 7

      - name: Gate the hot core and QUIC paths on allocation and scaling budgets (time baselines stay per-machine; MSVC's small deque blocks make its allocation counts incomparable)
        if: endsWith(matrix.preset, '-release') && runner.os != 'Windows'
        run: |
          out/build/${{ matrix.preset }}/core/core_perf
          out/build/${{ matrix.preset }}/platform/platform_perf

  repeat-windows:
    name: windows-latest · release, three more runs
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja nasm -y

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-windows-latest

      - name: Configure (app off - this job only runs the integration suite)
        run: cmake --preset x64-release -DDESKHUB_LINUX_APP=OFF

      - name: Build the integration suite
        run: cmake --build --preset x64-release --target integration_tests

      - name: Keep a dump, since the fastfail this hunts runs no in-process handler and so prints no stack
        shell: pwsh
        run: |
          $dumps = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $dumps -Force | Out-Null
          Set-ItemProperty -Path $dumps -Name DumpFolder -Value "$env:RUNNER_TEMP\crash-dumps" -Type ExpandString
          Set-ItemProperty -Path $dumps -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $dumps -Name DumpCount -Value 4 -Type DWord

      - name: Run the whole suite three more times, failing only on a crash - this is the one build that reproduces the stack corruption, and one run in three is not enough to see it
        shell: pwsh
        run: |
          $exe = 'out/build/x64-release/tests/integration/integration_tests.exe'
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "===== repeat run $i ====="
            & $exe
            $code = $LASTEXITCODE
            Write-Host "===== repeat run $i exit $code ====="
            if ($code -ne 0 -and $code -ne 1) {
              throw "integration_tests died with 0x$('{0:x8}' -f $code). Search the output above for 'the readable-stream list on the recv thread's stack changed' - the checkpoint it names is the call that overwrote it."
            }
          }

      - name: Look for a crash dump
        id: crash-dump
        if: failure()
        shell: pwsh
        run: |
          $found = Test-Path "$env:RUNNER_TEMP\crash-dumps\*.dmp"
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload the crash dump beside the symbols without which nothing can read it
        if: failure() && steps.crash-dump.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps-windows-repeat
          path: |
            ${{ runner.temp }}/crash-dumps
            out/build/x64-release/tests/integration/integration_tests.exe
            out/build/x64-release/tests/integration/integration_tests.pdb
          if-no-files-found: ignore
          retention-days: 7

  asan-windows:
    name: windows-latest · asan
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja nasm -y

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-windows-latest

      - name: Configure (app off - this job only runs the integration suite)
        run: cmake --preset asan-msvc -DDESKHUB_LINUX_APP=OFF

      - name: Build the integration suite
        run: cmake --build --preset asan-msvc --target integration_tests

      - name: Run the suite under AddressSanitizer, the only Windows build that can name the write itself rather than the frame it landed in
        shell: pwsh
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1:exitcode=42
        run: |
          $exe = 'out/build/asan-msvc/tests/integration/integration_tests.exe'
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "===== asan run $i ====="
            & $exe
            $code = $LASTEXITCODE
            Write-Host "===== asan run $i exit $code ====="
            if ($code -eq 42) {
              throw "AddressSanitizer reported a bad access. The report above names the file and line of the write - that is what the x64-release crash dump cannot give, so start there."
            }
            if ($code -ne 0 -and $code -ne 1) {
              throw "integration_tests died with 0x$('{0:x8}' -f $code) under ASan without an ASan report, so the corruption is one ASan does not instrument."
            }
          }

  perf-compare:
    name: perf · pull request vs base
    if: github.event_name == 'pull_request'
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Ninja
        run: scripts/apt-install.sh ninja-build

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-ubuntu-latest

      - name: Build the base commit and record both perf suites as this runner's baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git -c advice.detachedHead=false checkout --force "$BASE_SHA"
          git submodule update --init --recursive
          cmake --preset x64-release -DDESKHUB_LINUX_APP=OFF
          cmake --build --preset x64-release --target core_perf
          DESKHUB_PERF_WRITE="$RUNNER_TEMP/base-core.txt" out/build/x64-release/core/core_perf ||
            echo "::warning::the base commit failed its own core_perf budgets - drift is still measured against it"
          if cmake --build --preset x64-release --target platform_perf; then
            DESKHUB_PERF_WRITE="$RUNNER_TEMP/base-platform.txt" out/build/x64-release/platform/platform_perf ||
              echo "::warning::the base commit failed its own platform_perf budgets - drift is still measured against it"
          else
            echo "the base commit has no platform_perf target - its table will carry no drift column"
          fi

      - name: Build the pull request and measure drift against the base run (warnings only - a shared runner is too noisy to fail on time)
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          git checkout --force "$HEAD_SHA"
          git submodule update --init --recursive
          cmake --preset x64-release -DDESKHUB_LINUX_APP=OFF
          cmake --build --preset x64-release --target core_perf platform_perf integration_tests
          set -o pipefail
          if ! DESKHUB_PERF_BASELINE="$RUNNER_TEMP/base-core.txt" DESKHUB_PERF_TOLERANCE=0.5 \
              out/build/x64-release/core/core_perf 2>&1 | tee core-perf.log; then
            echo "::warning::core_perf drifted from the base commit or failed a budget"
            grep "FAIL:" core-perf.log | sed -e 's/^ *//' -e 's/^/::warning::/' || true
          fi
          if ! DESKHUB_PERF_BASELINE="$RUNNER_TEMP/base-platform.txt" DESKHUB_PERF_TOLERANCE=0.5 \
              out/build/x64-release/platform/platform_perf 2>&1 | tee platform-perf.log; then
            echo "::warning::platform_perf drifted from the base commit or failed a budget"
            grep "FAIL:" platform-perf.log | sed -e 's/^ *//' -e 's/^/::warning::/' || true
          fi

      - name: Measure lag under cross-load on the pull-request build
        run: |
          set -o pipefail
          out/build/x64-release/tests/integration/integration_tests --under-load 2>&1 |
              tee integration.log ||
            echo "::warning::the under-load integration run failed on this runner - its numbers below are incomplete"
          grep -E '^\[(load|lag)\]|^        ' integration.log > lag-lines.txt || true

      - name: Post the report as a pull-request comment (updates its own earlier comment)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          digest() {
            awk '$NF ~ /^[+-][0-9.]+%$/ {
                v = $NF + 0
                if (!n++) { hi = v; hin = $1; lo = v; lon = $1 }
                if (v > hi) { hi = v; hin = $1 }
                if (v < lo) { lo = v; lon = $1 }
              }
              END {
                if (!n) { print "no drift rows (the base commit has no such suite)"; exit }
                printf "%d rows · biggest slowdown %s %+.1f%% · biggest speedup %s %+.1f%%", n, hin, hi, lon, lo
              }' "$1"
          }
          budget_fails() {
            grep -c "FAIL:" "$1" || true
          }
          coverage_line="not measured on this run"
          if gh run download "$GITHUB_RUN_ID" -n coverage-summary -D "$RUNNER_TEMP/cov"; then
            coverage_line=$(head -1 "$RUNNER_TEMP/cov/coverage-summary.txt")
          fi
          table() {
            echo "<details><summary>$1</summary>"
            echo ''
            echo '```'
            grep -v '^\[Deskhub\]' "$2" || true
            echo '```'
            echo '</details>'
          }
          marker='<!-- deskhub-perf-compare -->'
          { echo "$marker"
            echo "### Perf and lag report - pull request vs base commit, same runner, 50% tolerance"
            echo ''
            echo "- core_perf: $(digest core-perf.log) · $(budget_fails core-perf.log) beyond budget"
            echo "- platform_perf: $(digest platform-perf.log) · $(budget_fails platform-perf.log) beyond budget"
            echo "- coverage: $coverage_line"
            echo ''
            table 'core_perf drift' core-perf.log
            table 'platform_perf drift' platform-perf.log
            table 'lag under cross-load (this pull request only)' lag-lines.txt
          } > perf-comment.md
          cat perf-comment.md >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@perf-comment.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@perf-comment.md >/dev/null
          fi

  sanitizers:
    name: ${{ matrix.os }} · ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: asan }
          - { os: ubuntu-latest, preset: tsan }
          - { os: macos-latest,  preset: asan }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + ninja
        if: runner.os == 'Linux'
        run: scripts/apt-install.sh clang ninja-build

      - name: Install ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-${{ matrix.os }}

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}
        env:
          CC: clang
          CXX: clang++

      - name: Build the three test binaries
        run: cmake --build --preset ${{ matrix.preset }}
             --target core_tests platform_tests integration_tests

      - name: Decide which FEC implementations this sanitizer run has to exercise
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "DESKHUB_FEC_MATRIX=full" >>"$GITHUB_ENV"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD |
              grep -qE '^core/(include/deskhub|src|tests)/transport/(FecScheme|FecTests|LossGoodputTests)'; then
            echo "DESKHUB_FEC_MATRIX=full" >>"$GITHUB_ENV"
          else
            echo "DESKHUB_FEC_MATRIX=shipping" >>"$GITHUB_ENV"
          fi

      - name: Run them under ${{ matrix.preset }}
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + ninja
        run: scripts/apt-install.sh clang ninja-build

      - name: Build + run the libFuzzer targets (make fuzz)
        run: make fuzz
        env:
          FUZZ_SECONDS: 30
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: |
            crash-*
            oom-*
            timeout-*
            out/fuzz/corpus
          retention-days: 14
          if-no-files-found: ignore

  android:
    name: android · ${{ matrix.abi }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, abi: x86_64,    rust_target: x86_64-linux-android,  emulator: true }
          - { os: ubuntu-latest, abi: arm64-v8a, rust_target: aarch64-linux-android, emulator: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BUILD_DIR: out/build/android-${{ matrix.abi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-sdk

      - name: Install Ninja
        run: scripts/apt-install.sh ninja-build

      - uses: ./.github/actions/third-party
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: ${{ matrix.rust_target }}

      - name: Cross-compile the test binaries for android-${{ matrix.abi }}
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_WERROR=ON \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build "$BUILD_DIR" \
            --target core_tests platform_tests integration_tests

      - name: Enable KVM for the emulator
        if: matrix.emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run them on an emulator
        if: matrix.emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: ${{ matrix.abi }}
          target: default
          disable-animations: true
          script: scripts/run-android-tests.sh ${{ matrix.abi }}

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja
        run: brew install ninja

      - uses: ./.github/actions/third-party
        with:
          targets: aarch64-apple-ios-sim
          cache-key: ios-sim

      - name: Build the test binaries for the iOS Simulator
        run: |
          cmake -B out/build/ios-sim -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDESKHUB_WERROR=ON \
            -DDESKHUB_CORE_TESTS=ON \
            -DDESKHUB_PLATFORM_TESTS=ON \
            -DDESKHUB_INTEGRATION_TESTS=ON
          cmake --build out/build/ios-sim \
            --target core_tests platform_tests integration_tests

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v))")
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"

      - name: Run them on the simulator
        run: |
          for t in core/core_tests platform/platform_tests tests/integration/integration_tests; do
            name=$(basename "$t")
            echo "===== $name on the iOS Simulator ====="
            xcrun simctl spawn "$SIM_UDID" "$PWD/out/build/ios-sim/$t.app/$name"
          done

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + llvm + ninja
        run: scripts/apt-install.sh clang llvm ninja-build

      - name: Build + measure coverage (make coverage)
        run: make coverage

      - name: Fail if core coverage regressed
        shell: bash
        run: |
          set -o pipefail
          scripts/check-coverage.sh | tee coverage-summary.txt

      - name: Share the coverage line with the pull-request report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: out/coverage
          retention-days: 14
          if-no-files-found: error
