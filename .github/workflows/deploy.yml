name: deploy

# The tag pipeline. Every publishing job sits behind the same test workflow the
# pull requests run, so a red test suite means nothing reaches TestFlight, Play
# or the GitHub release page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_track:
        description: 'Also promote to a closed track (on top of internal)'
        type: choice
        default: none
        options: [none, alpha]

permissions:
  contents: read

# The store pipeline must be reproducible: every job installs this exact
# fastlane instead of whatever the runner image happens to ship.
env:
  FASTLANE_VERSION: 2.237.0

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match VERSION
        run: scripts/check-version.sh

  tests:
    needs: version-check
    uses: ./.github/workflows/tests.yml

  apps:
    needs: tests
    uses: ./.github/workflows/apps.yml
    with:
      for_release: true

  github-release:
    needs: apps
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Rename with tag
        run: |
          mkdir -p out
          mv dist/deskhub-windows/Deskhub.exe "out/deskhub-${GITHUB_REF_NAME}-windows.exe"
          mv dist/deskhub-linux/deskhub "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          chmod +x "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          mv dist/deskhub-linux-deb/deskhub_*.deb "out/deskhub-${GITHUB_REF_NAME}-amd64.deb"
          mv dist/deskhub-linux-rpm/deskhub-*.rpm "out/deskhub-${GITHUB_REF_NAME}-x86_64.rpm"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            out/deskhub-${{ github.ref_name }}-windows.exe
            out/deskhub-${{ github.ref_name }}-linux-x86_64
            out/deskhub-${{ github.ref_name }}-amd64.deb
            out/deskhub-${{ github.ref_name }}-x86_64.rpm
          body: |
            ## 📦 Get it

            | Platform | File | Install |
            | --- | --- | --- |
            | 🪟 Windows | `deskhub-${{ github.ref_name }}-windows.exe` | Single file — just run it. Sharing prompts for admin once and the app configures the firewall by itself. |
            | 🍎 macOS | `deskhub-${{ github.ref_name }}-macos.dmg` | Notarized — opens without warnings. |
            | 🐧 Ubuntu, Kubuntu, Debian, Mint | `deskhub-${{ github.ref_name }}-amd64.deb` | `sudo apt install ./deskhub-${{ github.ref_name }}-amd64.deb` |
            | 🐧 Fedora (Workstation & KDE spin) | `deskhub-${{ github.ref_name }}-x86_64.rpm` | `sudo dnf install ./deskhub-${{ github.ref_name }}-x86_64.rpm` |
            | 🐧 openSUSE | `deskhub-${{ github.ref_name }}-x86_64.rpm` | `sudo zypper install ./deskhub-${{ github.ref_name }}-x86_64.rpm` |
            | 🐧 Arch, anything else | `deskhub-${{ github.ref_name }}-linux-x86_64` | `chmod +x deskhub-${{ github.ref_name }}-linux-x86_64 && ./deskhub-${{ github.ref_name }}-linux-x86_64` |
            | 🤖 Android | `deskhub-${{ github.ref_name }}-android.apk` | Release-signed, same key as the Google Play build — or join the [Play beta](https://play.google.com/apps/testing/com.manhpham.deskhub). |
            | 📱 iOS | — | [TestFlight](https://testflight.apple.com/join/7qY7wgpd) / App Store (an ipa cannot be sideloaded) |

            The macOS dmg and the Android apk are attached by their own jobs — they may show up a few minutes later.

            ## 🐧 Linux notes

            **To connect and view, installing is all it takes.** The app links only against GTK3, PipeWire and libva,
            which every stock desktop already has; the H.264 decoder is compiled in, so no FFmpeg package is involved.
            The deb and the rpm carry identical content — pick the one your package manager understands. The portable
            binary runs on any x86_64 distro with glibc 2.35+ (Ubuntu 22.04, Fedora 36, openSUSE 15.5, any current Arch).

            **To share this machine's screen**, three more things must be in place:

            1. **A screen-capture portal.** GNOME and KDE ship theirs out of the box — **nothing to do** on
               Ubuntu, Kubuntu, Fedora, openSUSE or Arch with GNOME/KDE. Standalone wlroots compositors
               (sway / river / Wayfire) need one; Hyprland has its own `xdg-desktop-portal-hyprland`:

               ```bash
               sudo apt install xdg-desktop-portal-wlr      # sway / river / Wayfire on Debian-family
               sudo dnf install xdg-desktop-portal-wlr      # …on Fedora
               sudo pacman -S xdg-desktop-portal-wlr        # …on Arch
               ```

            2. **A VA-API driver.** H.264 is encoded on the GPU; there is no software fallback:

               ```bash
               # Ubuntu / Debian / Mint
               sudo apt install va-driver-all vainfo        # NVIDIA also needs: nvidia-vaapi-driver

               # Fedora — stock Mesa has H.264 disabled; the working drivers live in RPM Fusion:
               sudo dnf install libva-utils
               sudo dnf install mesa-va-drivers-freeworld   # AMD (RPM Fusion)
               sudo dnf install intel-media-driver          # Intel (RPM Fusion)
               sudo dnf install nvidia-vaapi-driver         # NVIDIA (RPM Fusion)

               # openSUSE
               sudo zypper install libva-utils              # plus your GPU vendor's VA-API driver

               # Arch
               sudo pacman -S libva-utils
               sudo pacman -S libva-mesa-driver             # AMD · Intel: intel-media-driver · NVIDIA: libva-nvidia-driver

               # then on every distro:
               vainfo | grep -E 'H264.*Enc'                 # must print ≥1 line, or this machine cannot host
               ```

            3. **Write access to `/dev/uinput`** — how mouse and keyboard get injected. The deb/rpm installs
               this udev rule for you — nothing to do. On the portable binary, one command sets it up:

               ```bash
               curl -fsSL https://raw.githubusercontent.com/manhpham90vn/Deskhub/main/scripts/setup-uinput.sh | sudo bash
               ```

            If you enabled a firewall, also open UDP 47777 (`sudo ufw allow 47777/udp` /
            `sudo firewall-cmd --add-port=47777/udp --permanent`).

            ## 🔒 Before you share a screen

            **Deskhub has no password and no encryption of its own. Anyone who can reach UDP 47777 on a sharing
            machine gets full mouse and keyboard control of it.** Run it on a network you trust, or over a VPN —
            install [Tailscale](https://tailscale.com) on both machines and connect to the `100.x.y.z` address.
            **Never port-forward UDP 47777.** Full threat model in
            [SECURITY.md](https://github.com/manhpham90vn/Deskhub/blob/main/SECURITY.md).

  ios:
    needs: apps
    runs-on: macos-latest
    timeout-minutes: 60
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Fastlane release (build + TestFlight)
        working-directory: client/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane ios release

      - name: Upload ipa artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-ios-ipa
          path: client/ios/build/*.ipa
          retention-days: 30
          if-no-files-found: error

  macos:
    needs: apps
    runs-on: macos-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Fastlane release (build + notarize + dmg)
        working-directory: client/macos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane mac release

      - name: Verify Gatekeeper acceptance
        run: make verify-macos

      - name: Upload dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-macos-dmg
          path: out/dist/macos/Deskhub.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Rename with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv out/dist/macos/Deskhub.dmg "out/dist/macos/deskhub-${GITHUB_REF_NAME}-macos.dmg"

      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: out/dist/macos/deskhub-${{ github.ref_name }}-macos.dmg

  android:
    needs: apps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - run: gem install fastlane -v "$FASTLANE_VERSION" --no-document

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Fastlane release (build + Play internal)
        working-directory: client/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          PLAY_PROMOTE_TRACK: ${{ inputs.promote_track != 'none' && inputs.promote_track || '' }}
        run: fastlane android release

      - name: Upload aab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-android-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Rename apk with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv client/android/app/build/outputs/apk/release/app-release.apk "deskhub-${GITHUB_REF_NAME}-android.apk"

      - name: Attach apk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: deskhub-${{ github.ref_name }}-android.apk
