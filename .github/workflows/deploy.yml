name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_track:
        description: 'Also promote to a closed track (on top of internal)'
        type: choice
        default: none
        options: [none, alpha]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match VERSION
        run: scripts/check-version.sh

  build-desktop:
    needs: verify-tag
    uses: ./.github/workflows/build-desktop.yml
    with:
      for_release: true

  build-cli:
    needs: verify-tag
    uses: ./.github/workflows/build-cli.yml

  github-release:
    needs: [build-desktop, build-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Rename with tag
        run: |
          mkdir -p out
          mv dist/deskhub-windows/Deskhub.exe "out/deskhub-${GITHUB_REF_NAME}-windows.exe"
          mv dist/deskhub-linux/deskhub "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          chmod +x "out/deskhub-${GITHUB_REF_NAME}-linux-x86_64"
          mv dist/deskhub-cli-windows/deskhub-cli.exe "out/deskhub-cli-${GITHUB_REF_NAME}-windows.exe"
          mv dist/deskhub-cli-linux/deskhub-cli "out/deskhub-cli-${GITHUB_REF_NAME}-linux-x86_64"
          chmod +x "out/deskhub-cli-${GITHUB_REF_NAME}-linux-x86_64"
          mv dist/deskhub-cli-macos/deskhub-cli "out/deskhub-cli-${GITHUB_REF_NAME}-macos"
          chmod +x "out/deskhub-cli-${GITHUB_REF_NAME}-macos"
          mv dist/deskhub-linux-deb/deskhub_*.deb "out/deskhub-${GITHUB_REF_NAME}-amd64.deb"
          mv dist/deskhub-linux-rpm/deskhub-*.rpm "out/deskhub-${GITHUB_REF_NAME}-x86_64.rpm"

      - name: Write release notes
        run: |
          scripts/changelog.sh "$GITHUB_REF_NAME" > out/release-notes.md
          cat >> out/release-notes.md <<'EOF'
          ---

          📦 **Installing** — every platform, one page: [INSTALL.md](https://github.com/manhpham90vn/Deskhub/blob/main/docs/INSTALL.md).
          The `deskhub-cli-*` files are the same client without a window, for a script or an SSH session;
          the deb and the rpm already install it as `deskhub-cli`.
          The macOS dmg and the Android apk are attached by their own jobs and may show up a few minutes later;
          iOS ships through [TestFlight](https://testflight.apple.com/join/7qY7wgpd).

          🔒 **Before you share a screen** — sessions are encrypted (QUIC/TLS) and admission is a pairing handshake,
          but that is still a small secret on an open port: use a network you trust or a VPN, and never port-forward
          UDP 47777. Full threat model in [SECURITY.md](https://github.com/manhpham90vn/Deskhub/blob/main/SECURITY.md).
          EOF

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            out/deskhub-${{ github.ref_name }}-windows.exe
            out/deskhub-${{ github.ref_name }}-linux-x86_64
            out/deskhub-${{ github.ref_name }}-amd64.deb
            out/deskhub-${{ github.ref_name }}-x86_64.rpm
            out/deskhub-cli-${{ github.ref_name }}-windows.exe
            out/deskhub-cli-${{ github.ref_name }}-linux-x86_64
            out/deskhub-cli-${{ github.ref_name }}-macos
          body_path: out/release-notes.md

  release-ios:
    needs: verify-tag
    runs-on: macos-latest
    timeout-minutes: 60
    environment: stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/third-party
        with:
          targets: aarch64-apple-ios
          cache-key: ios

      - uses: ./.github/actions/fastlane

      - name: Fastlane release (build + TestFlight)
        working-directory: client/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane ios release

      - name: Upload ipa artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-ios-ipa
          path: client/ios/build/*.ipa
          retention-days: 30
          if-no-files-found: error

  release-macos:
    needs: verify-tag
    runs-on: macos-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/third-party
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
          cache-key: macos

      - uses: ./.github/actions/fastlane

      - name: Fastlane release (build + notarize + dmg)
        working-directory: client/macos
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: fastlane mac release

      - name: Verify Gatekeeper acceptance
        run: make verify-macos

      - name: Upload dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-macos-dmg
          path: out/dist/macos/Deskhub.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Rename with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv out/dist/macos/Deskhub.dmg "out/dist/macos/deskhub-${GITHUB_REF_NAME}-macos.dmg"

      - name: Attach dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/dist/macos/deskhub-${{ github.ref_name }}-macos.dmg

  release-android:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: stg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/android-sdk
        with:
          gradle: 'true'

      - uses: ./.github/actions/third-party
        with:
          targets: android
          cache-key: android

      - uses: ./.github/actions/fastlane

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Fastlane release (build + Play internal)
        working-directory: client/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          PLAY_PROMOTE_TRACK: ${{ inputs.promote_track != 'none' && inputs.promote_track || '' }}
        run: fastlane android release

      - name: Upload aab artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-android-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload apk artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deskhub-android-apk
          path: client/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Rename apk with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv client/android/app/build/outputs/apk/release/app-release.apk "deskhub-${GITHUB_REF_NAME}-android.apk"

      - name: Attach apk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: deskhub-${{ github.ref_name }}-android.apk
