name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang + ninja
        run: scripts/apt-install.sh clang ninja-build

      - name: Fuzz every target for 15 minutes (make fuzz)
        id: fuzz
        run: make fuzz
        env:
          FUZZ_SECONDS: 900
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

      - name: Fold new coverage back into the committed seed corpus
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git fetch origin nightly-fuzz-corpus; then
            git checkout FETCH_HEAD -- core/fuzz/seeds
          fi
          for t in fuzz_wire fuzz_annexb fuzz_h264sps fuzz_reassembler fuzz_session fuzz_uitext fuzz_term; do
            [ -x "out/build/fuzz/core/$t" ] || continue
            [ -d "out/fuzz/corpus/$t" ] || continue
            "out/build/fuzz/core/$t" -merge=1 "core/fuzz/seeds/$t" "out/fuzz/corpus/$t"
          done
          git add core/fuzz/seeds
          if git diff --cached --quiet; then
            echo "No new coverage tonight - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: fold new fuzz coverage into the seed corpus"
          git push --force origin HEAD:nightly-fuzz-corpus
          open_pr=$(gh pr list --head nightly-fuzz-corpus --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$open_pr" ]; then
            gh pr create --head nightly-fuzz-corpus \
              --title "chore: fold new fuzz coverage into the seed corpus" \
              --body "Tonight's fuzz run grew coverage: $RUN_URL. The checks below are dispatched onto the branch by the run that opened this, since a pull request opened with the workflow token raises none of its own."
          fi
          for workflow in ci lint security codeql; do
            gh workflow run "$workflow.yml" --ref nightly-fuzz-corpus ||
              echo "::error::could not dispatch $workflow.yml onto nightly-fuzz-corpus. A push or pull request made with the workflow token raises no run of its own, and workflow_dispatch is the one event that token may still raise, so this loop is the only thing that puts checks on the corpus pull request - without it the seed corpus merges into main having been built and tested by nothing."
          done

      - name: Upload crash reproducers
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-fuzz-crashes
          path: |
            crash-*
            oom-*
            timeout-*
          retention-days: 30
          if-no-files-found: ignore

      - name: File (or bump) the crash issue
        if: failure() && steps.fuzz.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create fuzz-crash --color B60205 \
            --description "Crash found by the nightly fuzz run" --force
          existing=$(gh issue list --label fuzz-crash --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --body "The nightly fuzz run crashed again: $RUN_URL"
            exit 0
          fi
          {
            echo "A libFuzzer target crashed during the scheduled fuzz run."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "The step log names the target that crashed. To reproduce,"
            echo "download the nightly-fuzz-crashes artifact from that run,"
            echo "build the fuzz targets locally (make fuzz FUZZ_SECONDS=1),"
            echo "then replay the input:"
            echo
            echo '    out/build/fuzz/core/<target> <crash-file>'
          } > /tmp/fuzz-issue-body.md
          gh issue create --title "Nightly fuzz run found a crash" \
            --label fuzz-crash --body-file /tmp/fuzz-issue-body.md

  quiche-checks-windows:
    name: windows-latest · integration against a quiche built with Rust checks on
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja nasm -y

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-windows-latest-quiche-checks
          rust-checks: 'true'

      - name: Configure (app off - this job only runs the integration suite)
        run: cmake --preset x64-debug -DDESKHUB_LINUX_APP=OFF

      - name: Build the integration suite
        run: cmake --build --preset x64-debug --target integration_tests

      - uses: ./.github/actions/windows-crash-dumps
        with:
          folder: ${{ runner.temp }}/crash-dumps
          keep: '6'

      - name: Run the load tests five times, where quiche stops at the first wrapped index or broken invariant instead of writing through it
        shell: pwsh
        env:
          DESKHUB_CRASH_DUMP_DIR: ${{ runner.temp }}/crash-dumps
          RUST_BACKTRACE: full
        run: |
          $exe = 'out/build/x64-debug/tests/integration/integration_tests.exe'
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "===== quiche checks run $i ====="
            & $exe --under-load
            $code = $LASTEXITCODE
            Write-Host "===== quiche checks run $i exit $code ====="
            if ($code -ne 0 -and $code -ne 1) {
              $null = & "$env:GITHUB_WORKSPACE/scripts/wait-for-crash-dump.ps1" -Folder "$env:RUNNER_TEMP\crash-dumps"
              throw "integration_tests died with 0x$('{0:x8}' -f $code) against a quiche built with debug assertions and overflow checks on. This job is the only one that can see inside quiche - ASan does not instrument Rust and the page heap only guards the heap - so if a panic message names a quiche file and line above, that line is the bug, not a later victim of it. With no panic above it, quiche is not the suspect and this build is only a slower one that changes the timing: the last crash that failed this job every night was ours, a connection the QUIC service loop kept using after a callback had freed it."
            }
          }

      - name: Look for a crash dump
        id: crash-dump
        if: failure()
        shell: pwsh
        run: |
          $found = Test-Path "$env:RUNNER_TEMP\crash-dumps\*.dmp"
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload the crash dump beside the symbols without which nothing can read it
        if: failure() && steps.crash-dump.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-quiche-checks-crash-dumps
          path: |
            ${{ runner.temp }}/crash-dumps
            out/build/x64-debug/tests/integration/integration_tests.exe
            out/build/x64-debug/tests/integration/integration_tests.pdb
          if-no-files-found: ignore
          retention-days: 30

  pageheap-windows:
    name: windows-latest · integration under the full page heap
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja nasm -y

      - uses: ./.github/actions/third-party
        with:
          cache-key: host-windows-latest

      - name: Configure (app off - this job only runs the integration suite)
        run: cmake --preset x64-debug -DDESKHUB_LINUX_APP=OFF

      - name: Build the integration suite
        run: cmake --build --preset x64-debug --target integration_tests

      - name: Give integration_tests.exe the full page heap, which puts an unwritable page behind every allocation
        shell: pwsh
        run: |
          $image = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\integration_tests.exe'
          New-Item -Path $image -Force | Out-Null
          Set-ItemProperty -Path $image -Name GlobalFlag -Value 0x02000000 -Type DWord
          Set-ItemProperty -Path $image -Name PageHeapFlags -Value 0x3 -Type DWord

      - uses: ./.github/actions/windows-crash-dumps
        with:
          folder: ${{ runner.temp }}/crash-dumps
          keep: '4'

      - name: Run the load tests three times, where a write past an allocation faults on the instruction that makes it
        shell: pwsh
        env:
          DESKHUB_CRASH_DUMP_DIR: ${{ runner.temp }}/crash-dumps
        run: |
          $exe = 'out/build/x64-debug/tests/integration/integration_tests.exe'
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "===== page heap run $i ====="
            & $exe --under-load
            $code = $LASTEXITCODE
            Write-Host "===== page heap run $i exit $code ====="
            if ($code -ne 0 -and $code -ne 1) {
              $null = & "$env:GITHUB_WORKSPACE/scripts/wait-for-crash-dump.ps1" -Folder "$env:RUNNER_TEMP\crash-dumps"
              throw "integration_tests died with 0x$('{0:x8}' -f $code) under the full page heap. Unlike every other Windows job, the stack printed above is the write itself and not a later victim of it - that frame is the bug. Note what this job cannot do: it guards allocations, so a use-after-free of an already freed block reads unmapped memory without ever overrunning anything, and this job stayed green through months of exactly that - a green run here rules out an overrun, nothing more."
            }
          }

      - name: Look for a crash dump
        id: crash-dump
        if: failure()
        shell: pwsh
        run: |
          $found = Test-Path "$env:RUNNER_TEMP\crash-dumps\*.dmp"
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload the crash dump beside the symbols without which nothing can read it
        if: failure() && steps.crash-dump.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-pageheap-crash-dumps
          path: |
            ${{ runner.temp }}/crash-dumps
            out/build/x64-debug/tests/integration/integration_tests.exe
            out/build/x64-debug/tests/integration/integration_tests.pdb
          if-no-files-found: ignore
          retention-days: 30
